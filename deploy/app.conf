# app.conf — estándar de deploy de /opt/apps (WebbApps)
# ============================================================================
# Lo lee _lib/run_app.sh. Los secretos NO van aquí: viven en
# /etc/colaboradores.env (600 root:root), fuera del repo.
#
# APP_AUTO_START=0 deja el contenedor en `created` y NO lo arranca. Es a
# propósito: un deploy nunca debe levantar algo sin que alguien lo pida
# explícitamente. Se arranca con:
#   sudo bash /opt/apps/_lib/run_app.sh colaboradores
# ============================================================================

APP_NAME=colaboradores
APP_IMAGE=hector1516/colaboradores:0.3.4

# Sin APP_REQUIRES_ENV: el run_app.sh valida que existan las variables antes de
# crear el contenedor, y este repo las necesita todas (HUB_DB_*).
APP_REQUIRES_ENV=HUB_DB_SERVER,HUB_DB_USER,HUB_DB_PASSWORD,HUB_DB_DATABASE

APP_NETWORKS=hub_default

# 8105 está libre (verificado con ss -lntp el 2026-10-06: ocupados 8100/8101/
# 8103/8104). Interno 8000, que es el PORT del CMD del Dockerfile.
APP_PORTS=8105:8000

# /data guarda el secreto del panel. Es el volumen que hay que respaldar.
APP_VOLUMES=colaboradores_data:/data

APP_RESTART=unless-stopped
APP_AUTO_START=0

APP_EXTRA_ENV=TZ,PORT

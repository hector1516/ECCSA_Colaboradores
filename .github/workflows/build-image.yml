name: Build y publicar imagen

# Objetivo: que la app se actualice sola cuando se publica una version nueva.
#
#   1. Esta workflow construye la imagen y la sube a ghcr.io
#   2. Arcane (docker.ecc-sa.com.mx) compara el digest local con el del
#      registry, ve que hay uno nuevo, y el operador le da "Update".
#
# Lo que NO hace, a proposito: no toca el contenedor. Arcane es el dueno del
# proyecto (docker.ecc-sa.com.mx) y recrea el contenedor desde su compose. Si
# esta workflow hiciera `docker rm colaboradores`, dejaria el project de Arcane sin
# contenedor.
#
# Requisitos en GitHub: el paquete debe permitir el workflow. En
# Settings → Actions → General, "Allow GitHub Actions to create and approve
# pull requests" no es necesario, pero el paquete tiene que permitir que este
# repo lo escriba: es lo que hace el `packages: write` de abajo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-colaboradores
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Fijo, no ${{ github.repository }}: el nombre del paquete tiene que ser
  # EXACTAMENTE el que usa el compose de Arcane, o Arcane va a mirar una
  # imagen que este workflow nunca publica.
  IMAGE_NAME: hector1516/colaboradores

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Colaboradores · imagen publicada"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- imagen: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "Arcane la detecta en su proximo chequeo. Para aplicarla:"
            echo "**Arcane → Projects → colaboradores → Updates → Update**"
          } >> "$GITHUB_STEP_SUMMARY"